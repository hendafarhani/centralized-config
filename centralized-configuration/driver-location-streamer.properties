spring.application.name=driver-location-streamer
kafka.bootstrap-servers=kafka:9092
# This key stays local: kafka.topics.rider-location means driver.location.updated
# here but rider.location in location-saver and location-rider, so it cannot go
# in the shared file. The name is misleading - this service reads driver
# locations, not rider locations. Renaming it in DriverLocationStreamHandler.java
# to ${microgo.topics.driver-location-updated} would let the alias move to
# application.properties; that is a service-repository change, not made here.
kafka.topics.rider-location=${microgo.topics.driver-location-updated}
kafka.consumers.driver-location-streamer.group-id=driver.location.websocket.group
kafka.listeners.driver-location-streamer.id=driverLocationStreamerListener

server.port=${PORT:0}

eureka.client.serviceUrl.defaultZone=http://discovery:8082/eureka
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

spring.devtools.restart.enabled=true
