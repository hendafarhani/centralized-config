# =============================================================================
# Shared configuration - served to every Spring Cloud Config client
# =============================================================================
#
# The config server runs the native profile over this folder. A file named
# application.properties is served to EVERY client automatically, merged
# UNDERNEATH that client's own {spring.application.name}.properties.
#
# Underneath matters: if a key is defined in both places the service file wins
# and this file is ignored for that key. So a topic defined here must NOT also
# be defined in the service file.
#
# WHAT BELONGS HERE
#   Kafka topic names, and nothing else. A topic name is the channel two
#   services exchange messages on - an agreement between them, so one copy is
#   right and several copies drift.
#
# WHAT MUST NEVER COME HERE
#   Consumer group ids (kafka.consumers.*.group-id, *.consumer-group-id,
#   *.ack-group-id) and listener ids. Kafka delivers each message to exactly
#   ONE member of a consumer group. Two services sharing a group id would not
#   look like two applications to Kafka - they would look like one application
#   with two instances, and the records would be split between them. Nothing
#   throws; each service just silently receives about half of what it should.
#   Group ids must DIFFER per service, so they stay in {service}.properties.
#   Listener ids are local Spring bean names, not a contract, and stay too.
#   kafka.bootstrap-servers is an infrastructure address and also stays put.
#
# LAYOUT
#   1. microgo.topics.* - every topic string in the fleet, defined exactly
#      once. The canonical name is derived from the VALUE (dots become
#      hyphens), never from any one service's key name, because some key names
#      disagree with the topic they point at.
#   2. Aliases - each service's existing key name pointed at its canonical key,
#      so every service keeps the key its Java code already binds and no
#      service code changes. Aliases can be retired one service at a time as
#      each moves to reading microgo.topics.* directly.
#
# Spring resolves ${...} against the whole merged Environment, which is why an
# alias here resolves against the canonical key above it - and why an alias
# left in a service file can still point at a canonical key defined here.
# The config server itself does NOT resolve placeholders: anything reading
# /{service}/default over HTTP sees the literal ${...} and must resolve it.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Canonical topic names - each defined exactly once
# -----------------------------------------------------------------------------

# --- ride lifecycle ---
microgo.topics.ride-requests=ride.requests
microgo.topics.ride-request-events=ride.request.events
microgo.topics.ride-request-events-acks=ride.request.events.acks
microgo.topics.ride-assigned=ride.assigned
microgo.topics.ride-cancelled=ride.cancelled

# --- driver lifecycle ---
microgo.topics.driver-generated=driver.generated
microgo.topics.driver-location-updated=driver.location.updated
microgo.topics.driver-zone-entered=driver.zone.entered
microgo.topics.driver-reached-pickup=driver.reached.pickup
microgo.topics.driver-reached-destination=driver.reached.destination
microgo.topics.driver-available=driver.available
microgo.topics.driver-notified=driver.notified

# --- driver commands ---
microgo.topics.driver-command-reposition=driver.command.reposition
microgo.topics.driver-command-move-to-pickup=driver.command.move-to-pickup
microgo.topics.driver-command-start-trip=driver.command.start-trip
microgo.topics.driver-command-stop=driver.command.stop

# --- rider location ---
# Distinct from driver.location.updated despite the similar name. See the
# kafka.topics.rider-location note in section 2.
microgo.topics.rider-location=rider.location

# --- simulation ---
microgo.topics.scenario-started=scenario.started
microgo.topics.simulation-passenger-generated=simulation.passenger.generated
microgo.topics.simulation-ride-requested=simulation.ride.requested
microgo.topics.simulation-driver-accepted=simulation.driver.accepted
microgo.topics.simulation-driver-refused=simulation.driver.refused
microgo.topics.simulation-metrics-updated=simulation.metrics.updated
microgo.topics.simulation-completed=simulation.completed

# --- optimization ---
microgo.topics.optimization-requested=optimization.requested
microgo.topics.optimization-completed=optimization.completed
microgo.topics.driver-repositioning-recommended=driver.repositioning.recommended
microgo.topics.optimized-assignment-recommended=optimized.assignment.recommended


# -----------------------------------------------------------------------------
# 2. Aliases - existing service key names pointing at the canonical keys
# -----------------------------------------------------------------------------
# Grouped by key namespace, because that is what has to be unique here: this
# file is one namespace for the whole fleet, so a key name may live here only
# if it means the same thing in every service that defines it.

# --- kafka.topics.* (driver-location-generator, ride-request) ---
kafka.topics.ride-requests=${microgo.topics.ride-requests}
kafka.topics.driver-generated=${microgo.topics.driver-generated}
kafka.topics.driver-location-updated=${microgo.topics.driver-location-updated}
kafka.topics.driver-entered-zone=${microgo.topics.driver-zone-entered}
kafka.topics.driver-reached-pickup=${microgo.topics.driver-reached-pickup}
kafka.topics.driver-reached-destination=${microgo.topics.driver-reached-destination}
kafka.topics.driver-became-available=${microgo.topics.driver-available}
kafka.topics.reposition-driver-command=${microgo.topics.driver-command-reposition}
kafka.topics.move-to-pickup-command=${microgo.topics.driver-command-move-to-pickup}
kafka.topics.start-trip-command=${microgo.topics.driver-command-start-trip}
kafka.topics.stop-driver-command=${microgo.topics.driver-command-stop}
kafka.topics.driver-accepted=${microgo.topics.simulation-driver-accepted}
kafka.topics.driver-refused=${microgo.topics.simulation-driver-refused}
kafka.topics.ride-cancelled=${microgo.topics.ride-cancelled}

# kafka.topics.rider-location is DELIBERATELY ABSENT.
# It is the one key name in the fleet that means different things in different
# services: driver.location.updated in driver-location-streamer, rider.location
# in location-saver and location-rider. This file has a single namespace, so
# the key could only hold one value here and one of those services would be
# silently repointed at the wrong topic. It therefore stays in each service
# file, aliased there to the right canonical key above. The topic strings still
# live in one place; only the alias is local.
# The streamer's key name also lies about what it reads. Renaming it to
# ${microgo.topics.driver-location-updated} in
# DriverLocationStreamHandler.java would let the alias move here - a one-line
# change in a service repository, deliberately not made by this refactor.

# --- dashboard.service.* ---
dashboard.service.event-topic=${microgo.topics.ride-request-events}
dashboard.service.ack-topic=${microgo.topics.ride-request-events-acks}

# --- outbox.publisher.* ---
# Same two channels as dashboard-service above - that pairing is the point.
outbox.publisher.event-topic=${microgo.topics.ride-request-events}
outbox.publisher.ack-topic=${microgo.topics.ride-request-events-acks}

# --- optimization-service.topics.* ---
# Note simulated-ride-requested points at simulation.ride.requested; the
# canonical name follows the value, not this key name.
optimization-service.topics.scenario-started=${microgo.topics.scenario-started}
optimization-service.topics.simulated-ride-requested=${microgo.topics.simulation-ride-requested}
optimization-service.topics.simulation-metrics-updated=${microgo.topics.simulation-metrics-updated}
optimization-service.topics.simulation-completed=${microgo.topics.simulation-completed}
optimization-service.topics.driver-location-updated=${microgo.topics.driver-location-updated}
optimization-service.topics.ride-assigned=${microgo.topics.ride-assigned}
optimization-service.topics.ride-cancelled=${microgo.topics.ride-cancelled}
optimization-service.topics.optimization-requested=${microgo.topics.optimization-requested}
optimization-service.topics.optimization-completed=${microgo.topics.optimization-completed}
optimization-service.topics.driver-repositioning-recommended=${microgo.topics.driver-repositioning-recommended}
optimization-service.topics.optimized-assignment-recommended=${microgo.topics.optimized-assignment-recommended}

# --- simulation-service.topics.* ---
simulation-service.topics.scenario-started=${microgo.topics.scenario-started}
simulation-service.topics.driver-generated=${microgo.topics.driver-generated}
simulation-service.topics.passenger-generated=${microgo.topics.simulation-passenger-generated}
simulation-service.topics.simulated-ride-requested=${microgo.topics.simulation-ride-requested}
simulation-service.topics.driver-accepted=${microgo.topics.simulation-driver-accepted}
simulation-service.topics.driver-refused=${microgo.topics.simulation-driver-refused}
simulation-service.topics.simulation-metrics-updated=${microgo.topics.simulation-metrics-updated}
simulation-service.topics.simulation-completed=${microgo.topics.simulation-completed}
simulation-service.topics.driver-location-updated=${microgo.topics.driver-location-updated}
simulation-service.topics.driver-notified=${microgo.topics.driver-notified}
simulation-service.topics.ride-assigned=${microgo.topics.ride-assigned}
simulation-service.topics.ride-cancelled=${microgo.topics.ride-cancelled}
