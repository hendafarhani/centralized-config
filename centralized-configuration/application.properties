# =============================================================================
# Shared configuration - served to every Spring Cloud Config client
# =============================================================================
#
# The config server runs the native profile over this folder. A file named
# application.properties is served to EVERY client automatically, merged
# UNDERNEATH that client's own {spring.application.name}.properties.
#
# Underneath matters: if a key is defined in both places the service file wins
# and this file is ignored for that key. So a topic defined here must NOT also
# be defined in a service file.
#
# WHAT BELONGS HERE
#   Kafka topic names, and nothing else. A topic name is the channel two
#   services exchange messages on - an agreement between them, so one copy is
#   right and several copies drift.
#
# WHAT MUST NEVER COME HERE
#   Consumer group ids (kafka.consumers.*.group-id, *.consumer-group-id,
#   *.ack-group-id) and listener ids. Kafka delivers each message to exactly
#   ONE member of a consumer group. Two services sharing a group id would not
#   look like two applications to Kafka - they would look like one application
#   with two instances, and the records would be split between them. Nothing
#   throws; each service just silently receives about half of what it should.
#   Group ids must DIFFER per service, so they stay in {service}.properties.
#   Listener ids are local Spring bean names, not a contract, and stay too.
#   kafka.bootstrap-servers is an infrastructure address and also stays put.
#
# NAMING
#   The canonical name is derived from the VALUE, dots becoming hyphens:
#   simulation.ride.requested -> microgo.topics.simulation-ride-requested.
#   Never from a service's own key name. Several services used names that
#   disagreed with the topic they pointed at - one key called rider-location
#   held driver.location.updated - which is how a single channel ended up known
#   by four different names across the fleet.
#
# ADDING A TOPIC
#   Define it here, once, and read ${microgo.topics.<name>} from the service.
#   Do not add a service-local key holding the same string: that is the
#   duplication this file exists to remove, and the config-drift CI job will
#   not catch a second copy that never disagrees - until the day it does.
#
# Spring resolves ${...} against the whole merged Environment, so a service
# file may reference any key defined here. The config server itself does NOT
# resolve placeholders: anything reading /{service}/default over HTTP sees the
# literal ${...} and must resolve it.
# =============================================================================


# --- ride lifecycle ---
microgo.topics.ride-requests=ride.requests
microgo.topics.ride-request-events=ride.request.events
microgo.topics.ride-request-events-acks=ride.request.events.acks
microgo.topics.ride-assigned=ride.assigned
microgo.topics.ride-cancelled=ride.cancelled

# --- driver lifecycle ---
microgo.topics.driver-generated=driver.generated
microgo.topics.driver-location-updated=driver.location.updated
microgo.topics.driver-zone-entered=driver.zone.entered
microgo.topics.driver-reached-pickup=driver.reached.pickup
microgo.topics.driver-reached-destination=driver.reached.destination
microgo.topics.driver-available=driver.available
microgo.topics.driver-notified=driver.notified

# --- driver commands ---
microgo.topics.driver-command-reposition=driver.command.reposition
microgo.topics.driver-command-move-to-pickup=driver.command.move-to-pickup
microgo.topics.driver-command-start-trip=driver.command.start-trip
microgo.topics.driver-command-stop=driver.command.stop

# --- rider location ---
# A different channel from driver.location.updated, despite the similar name.
# location-rider still reaches this through a kafka.topics.rider-location alias
# in its own file - the last alias left in the fleet, kept because no
# repository in .gitmodules claims that application name, so there is no code
# to migrate. Retire it with the file if location-rider is confirmed dead.
microgo.topics.rider-location=rider.location

# --- simulation ---
microgo.topics.scenario-started=scenario.started
microgo.topics.simulation-passenger-generated=simulation.passenger.generated
microgo.topics.simulation-ride-requested=simulation.ride.requested
microgo.topics.simulation-driver-accepted=simulation.driver.accepted
microgo.topics.simulation-driver-refused=simulation.driver.refused
microgo.topics.simulation-metrics-updated=simulation.metrics.updated
microgo.topics.simulation-completed=simulation.completed

# --- optimization ---
microgo.topics.optimization-requested=optimization.requested
microgo.topics.optimization-completed=optimization.completed
microgo.topics.driver-repositioning-recommended=driver.repositioning.recommended
microgo.topics.optimized-assignment-recommended=optimized.assignment.recommended
